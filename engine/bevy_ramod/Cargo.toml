[package]
name = "bevy_ramod"
version = "0.1.0"
edition = "2021"
description = "Bevy integration for RaMOD — open-source FMOD-class audio (Bevy 0.20)"
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.85"

[features]
default = []
# Renzora Engine integration: exposes adapter hooks and docs for using
# bevy_ramod as a first-class audio path inside https://github.com/renzora/engine
# (Bevy 0.20 aligned). Does not pull the full engine; see docs/RENZORA.md.
renzora = []

[dependencies]
bevy = { version = "0.20", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_window",
    "bevy_winit",
    "x11",
    "multi_threaded",
] }
ramod = { path = "../..", default-features = true, features = ["decoder-rust"] }
ramod_runtime = { path = "../../runtime", default-features = false, features = ["backend-cpal", "live-update"] }
ramod_waveform = { path = "../../waveform" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "load_bank"
path = "examples/load_bank.rs"

[[example]]
name = "load_fsb"
path = "examples/load_fsb.rs"

[[example]]
name = "live_update"
path = "examples/live_update.rs"

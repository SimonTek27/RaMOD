[package]
name = "bevy_ramod"
version = "0.1.0"
edition = "2021"
description = "Bevy integration for RaMOD — open-source FMOD-class audio"
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.85"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_window",
    "bevy_winit",
    "x11",
    "multi_threaded",
] }
ramod = { path = ".." }
ramod_runtime = { path = "../runtime", default-features = false, features = ["backend-cpal"] }
ramod_waveform = { path = "../waveform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "load_bank"
path = "examples/load_bank.rs"

[[example]]
name = "load_fsb"
path = "examples/load_fsb.rs"

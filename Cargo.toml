[workspace]
members = [".", "editor", "runtime", "bevy_ramod", "waveform"]
resolver = "2"

[workspace.package]
license = "GPL-3.0-or-later"
repository = "https://github.com/SimonTek27/RaMOD"
edition = "2021"

[package]
name = "ramod"
version = "0.1.1"
edition = "2021"
description = "RaMOD — Rust Audio mod: open-source FSB5 middleware (read/write, Ogg Vorbis, pure-Rust encode/decode). Foundation of an FMOD-class stack for Bevy."
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/SimonTek27/RaMOD"
keywords = ["fsb5", "vorbis", "audio", "middleware", "modding", "bevy"]
categories = ["multimedia::audio", "parser-implementations", "command-line-utilities"]
rust-version = "1.85"
exclude = ["tools/**", "editor/**", "runtime/**", "bevy_ramod/**", "waveform/**"]

[features]
default = ["encoder-rust", "decoder-rust"]
encoder-rust = ["dep:rusty_vorbis"]
decoder-rust = ["dep:lewton"]
encoder-dll = []

[dependencies]
rusty_vorbis = { version = "0.1.1", optional = true, default-features = false }
lewton = { version = "0.10", optional = true }

[build-dependencies]
base64 = "0.22"
flate2 = "1"

[lib]
name = "ramod"
path = "src/lib.rs"

[[bin]]
name = "ramod"
path = "src/bin/ramod.rs"

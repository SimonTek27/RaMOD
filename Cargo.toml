[package]
name = "ramod"
version = "0.1.0"
edition = "2021"
description = "RaMOD — Rust Audio mod: an open-source FSB5 audio middleware (FSB5 read/write, Ogg Vorbis import/export, PCM → Vorbis encoding). Foundation of an open-source FMOD-class stack for Bevy."
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/SimonTek27/RaMOD"
keywords = ["fsb5", "vorbis", "audio", "middleware", "modding", "bevy"]
categories = ["multimedia::audio", "parser-implementations", "command-line-utilities"]
rust-version = "1.85"
exclude = ["tools/**"]

[features]
default = ["encoder-rust"]
# Pure-Rust Vorbis encoder (rusty_vorbis). Cross-platform, no C/FFI.
encoder-rust = ["dep:rusty_vorbis"]
# Legacy Windows path: load libfsbvorbis64.dll at runtime (no cargo dep).
encoder-dll = []

[dependencies]
rusty_vorbis = { version = "0.1.1", optional = true, default-features = false }

[lib]
name = "ramod"
path = "src/lib.rs"

[[bin]]
name = "ramod"
path = "src/bin/ramod.rs"

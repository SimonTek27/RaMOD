[package]
name = "ramod_runtime"
version = "0.1.0"
edition = "2021"
description = "RaMOD real-time audio runtime — FMOD Core–class mixer (open source)"
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.85"

[features]
default = ["backend-cpal"]
backend-cpal = ["dep:cpal"]
# TCP Live Update server/client (std only).
live-update = []

[dependencies]
cpal = { version = "0.15", optional = true }

[[example]]
name = "live_update_demo"
required-features = ["live-update"]
